{{- if .Values.ingress.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "todo-manager.fullname" . }}
  labels:
    {{- include "todo-manager.labels" . | nindent 4 }}
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: eg
    namespace: envoy-gateway-system
    sectionName: https
  hostnames:
    {{- range .Values.ingress.hosts }}
    - {{ .host | quote }}
    {{- end }}
  rules:
  - backendRefs:
    - name: {{ include "todo-manager.fullname" $ }}
      kind: Service
      port: {{ $.Values.service.port }}
{{- end }}
