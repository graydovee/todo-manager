# 构建多架构镜像 → 合并 manifest → 回写**本仓库** chart 的 image.tag（ArgoCD 随后部署）。
#
# 触发：**只有打 tag 才触发**，分支推送不构建。
#   发版 = 打 tag：git tag -a v0.2.0 -m v0.2.0 && git push origin v0.2.0
#   这样 CI 回写提交落在分支上时不会再触发 CI，从机制上避免自我循环。
#
# 前置：
#   - 本仓库 charts/todolist/values.yaml 里有一行 "  tag: <版本>"
#   - Actions secrets：CI_GIT_USER / CI_GIT_TOKEN / HARBOR_USERNAME / HARBOR_PASSWORD
#   - charts 仓库 apps/todolist/overlays/values.yaml 只放自定义配置（不含 image.*）
name: build-and-release

on:
  push:
    tags: ["v*"]

env:
  REGISTRY: harbor.graydove.cn
  IMAGE: harbor.graydove.cn/apps/todo-manager
  REPO: git.graydove.cn/graydove/todo-manager.git
  BRANCH: master

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: linux-amd64, arch: amd64 }
          - { runner: linux-arm64, arch: arm64 }
    # 凭据走环境变量，不要内联进脚本
    env:
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
      CI_GIT_USER: ${{ secrets.CI_GIT_USER }}
      CI_GIT_TOKEN: ${{ secrets.CI_GIT_TOKEN }}
    steps:
      - name: checkout
        run: |
          set -eu
          git clone --branch '${{ github.ref_name }}' --depth 1 \
            "https://${CI_GIT_USER}:${CI_GIT_TOKEN}@${REPO}" .

      - name: build & push
        run: |
          set -eu
          TAG='${{ github.ref_name }}'
          echo "$HARBOR_PASSWORD" | docker login "$REGISTRY" -u "$HARBOR_USERNAME" --password-stdin
          docker build -t "${IMAGE}:${TAG}-${{ matrix.arch }}" .
          docker push "${IMAGE}:${TAG}-${{ matrix.arch }}"

  merge:
    name: merge manifest
    needs: [build]
    runs-on: linux-amd64
    env:
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
    steps:
      - name: merge per-arch images into one multi-arch manifest
        run: |
          set -eu
          TAG='${{ github.ref_name }}'
          echo "$HARBOR_PASSWORD" | docker login "$REGISTRY" -u "$HARBOR_USERNAME" --password-stdin
          docker buildx imagetools create \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:latest" \
            "${IMAGE}:${TAG}-amd64" "${IMAGE}:${TAG}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${TAG}"

  bump-chart:
    name: bump chart tag
    needs: [merge]
    runs-on: linux-amd64
    env:
      CI_GIT_USER: ${{ secrets.CI_GIT_USER }}
      CI_GIT_TOKEN: ${{ secrets.CI_GIT_TOKEN }}
    steps:
      - name: update image tag in this repo's chart values
        run: |
          set -eu
          TAG='${{ github.ref_name }}'
          git clone --branch "${BRANCH}" "https://${CI_GIT_USER}:${CI_GIT_TOKEN}@${REPO}" /tmp/app
          cd /tmp/app
          # chart values 里 tag 行格式为 "  tag: vX.Y.Z"
          sed -i "s|^  tag: .*|  tag: ${TAG}|" charts/todolist/values.yaml
          # 匹配不到就报错退出
          grep -q "^  tag: ${TAG}$" charts/todolist/values.yaml \
            || { echo "charts/todolist/values.yaml 里没找到匹配的 tag 行" >&2; exit 1; }
          git --no-pager diff --stat
          if git diff --quiet; then
            echo "chart 里的 tag 已经是 ${TAG}，无需提交"
            exit 0
          fi
          git config user.name "graydove-ci"
          git config user.email "ci@graydove.cn"
          git commit -am "todolist: 镜像升级到 ${TAG}（CI 自动提交）"
          # 推默认分支；本 workflow 只由 tag 触发，所以不会再触发一次 CI
          git push origin "${BRANCH}"
